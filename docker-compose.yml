version: '3.8'

services:
  insurance-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/xgb_insurance_pricing_model.joblib
    volumes:
      - ./models/xgb_insurance_pricing_model.joblib:/app/models/xgb_insurance_pricing_model.joblib
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped